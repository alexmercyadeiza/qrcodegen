name: Patch framework for Netlify deployment
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update patched framework versions
        run: npm install --package-lock-only --ignore-scripts --save-exact next@15.5.27 eslint-config-next@15.5.27 react@19.0.8 react-dom@19.0.8
      - run: npm ci
      - name: Verify real QR exports
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import QRCode from "qrcode";
          import { createQRDownload } from "./app/lib/qr-download.js";
          const require = createRequire(import.meta.url);
          const { PNG } = require("pngjs");
          for (const text of ["https://example.com", "https://onecon.live", "https://example.com/" + "long-path-".repeat(30)]) {
            const blob = await createQRDownload(text, "png");
            assert.ok(blob.size >= 1048576);
            const png = PNG.sync.read(Buffer.from(await blob.arrayBuffer()));
            assert.ok(png.width >= 4096);
            assert.equal(png.width, png.height);
            const { modules } = QRCode.create(text, { errorCorrectionLevel: "H" });
            const scale = png.width / (modules.size + 8);
            assert.equal(scale, Math.floor(scale));
            for (let y = 0; y < modules.size; y++) {
              for (let x = 0; x < modules.size; x++) {
                const pixel = ((y + 4) * scale * png.width + (x + 4) * scale) * 4;
                assert.equal(png.data[pixel], modules.get(y, x) ? 0 : 255);
                assert.equal(png.data[pixel + 3], 255);
              }
            }
            const svg = await (await createQRDownload(text, "svg")).text();
            assert.match(svg, /<svg/);
            assert.match(svg, /<path/);
            assert.doesNotMatch(svg, /<image/);
            console.log(JSON.stringify({ width: png.width, bytes: blob.size, svg: "vector", valid: true }));
          }
          NODE
      - run: npm run build
      - name: Commit verified dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Next.js and React to patched versions for Netlify"
          git push origin HEAD:main
